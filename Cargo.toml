[package]
name = "oh-snap"
version = "0.11.0"
edition = "2024"
description = "A fast screen snipping tool for Windows"
license = "MIT"
repository = "https://github.com/codepawl/oh-snap"

[dependencies]
gif = "0.14"
rqrr = "0.11"
jpeg-encoder = "0.7"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation_Collections",
    "Foundation_Numerics",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com_StructuredStorage",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    # Not called directly. Without it, HRESULT::message() crashes on the GNU toolchain with
    # llvm-ar as dlltool: measured 5 of 5 crashes against 0 of 5.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.12"
fontdue = "0.9"

# Linux only. Pure-Rust crates, so the binary needs no system library at run time.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr"] }
# async-io instead of the default tokio: zbus then runs on a small executor.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot", "global_shortcuts"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
futures-lite = "2"
wl-clipboard-rs = "0.9"
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-av-foundation = { version = "0.3", features = ["block2", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-screen-capture-kit = "0.3"
objc2-vision = "0.3"
objc2-image-io = "0.3"
global-hotkey = "0.9"
tray-icon = "0.26"
