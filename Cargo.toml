[package]
name = "oh-snap"
version = "0.11.0"
edition = "2024"
description = "A fast screen snipping tool for Windows"
license = "MIT"
repository = "https://github.com/codepawl/oh-snap"

[dependencies]
gif = "0.14"
rqrr = "0.11"
jpeg-encoder = "0.7"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation_Collections",
    "Foundation_Numerics",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com_StructuredStorage",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    # Not called directly. Without it, HRESULT::message() crashes on the GNU toolchain with
    # llvm-ar as dlltool: measured 5 of 5 crashes against 0 of 5.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.12"
fontdue = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
# Pure-Rust TLS: ring and aws-lc need a C compiler, which `cargo check --target` lacks here.
rustls-rustcrypto = "0.0.2-alpha"
sha2 = "0.10"

# `desktop::ui` and `desktop::update` also build in Windows tests, so the drawing and the
# checksum code run on the machine the app is written on.
[target.'cfg(windows)'.dev-dependencies]
tiny-skia = "0.12"
fontdue = "0.9"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls-rustcrypto = "0.0.2-alpha"
