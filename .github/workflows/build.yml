name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Smoke test under Xvfb
        # The capture must write a PNG as large as the virtual screen.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          ./target/release/oh-snap --version
          xvfb-run -a -s "-screen 0 1280x720x24" ./target/release/oh-snap capture screen --out shot.png
          python3 -c "import struct; head = open('shot.png', 'rb').read(24); assert head[1:4] == b'PNG', 'not a PNG'; size = struct.unpack('>II', head[16:24]); assert size == (1280, 720), size"

      - name: Package
        run: |
          tar -czf oh-snap-linux-${{ matrix.arch }}.tar.gz -C target/release oh-snap
          sha256sum oh-snap-linux-${{ matrix.arch }}.tar.gz | tee oh-snap-linux-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: oh-snap-linux-${{ matrix.arch }}
          path: |
            oh-snap-linux-${{ matrix.arch }}.tar.gz
            oh-snap-linux-${{ matrix.arch }}.sha256

  macos:
    # The universal app. With the signing secrets it gets a Developer ID signature, and a
    # release tag also notarizes it; without them (forks) it is signed ad hoc.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add both Mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Test
        run: cargo test --release --locked

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "no signing secrets: the app is signed ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && -n "$APPLE_API_ISSUER_ID" ]]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            {
              echo "NOTARY_KEY_FILE=$RUNNER_TEMP/notary.p8"
              echo "NOTARY_KEY_ID=$APPLE_API_KEY_ID"
              echo "NOTARY_ISSUER=$APPLE_API_ISSUER_ID"
            } >> "$GITHUB_ENV"
          fi

      - name: Assemble, sign and package the app
        run: |
          bash packaging/macos/make-app.sh \
            target/aarch64-apple-darwin/release/oh-snap \
            target/x86_64-apple-darwin/release/oh-snap \
            dist

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: oh-snap-macos
          path: |
            dist/oh-snap-macos.zip
            dist/oh-snap-macos.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Smoke test
        # oh-snap is a GUI-subsystem program, so PowerShell must be told to wait for it.
        run: |
          $run = Start-Process ./target/release/oh-snap.exe -ArgumentList 'preview', 'preview-out' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "preview exited with $($run.ExitCode)" }
          if (-not (Test-Path preview-out/card-saved.png)) { throw "preview did not render" }
          $run = Start-Process ./target/release/oh-snap.exe -ArgumentList 'addons', 'run', 'data-uri', 'preview-out/card-saved.png' -Wait -PassThru -NoNewWindow -RedirectStandardOutput addon-out.txt
          if ($run.ExitCode -ne 0 -or -not ((Get-Content addon-out.txt -Raw) -like 'data:image/png;base64,*')) { throw "data-uri add-on failed" }
          # A Windows error must come out as text: exit 1, not a crash.
          $run = Start-Process ./target/release/oh-snap.exe -ArgumentList 'gif', 'no-such-recording.mp4' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 1) { throw "gif on a missing file exited with $($run.ExitCode)" }
          # A crash must leave its line in the log.
          $run = Start-Process ./target/release/oh-snap.exe -ArgumentList 'crash-test' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -eq 0) { throw "crash-test did not crash" }
          $log = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'oh-snap/oh-snap.log'
          if (-not (Select-String -Path $log -Pattern 'crash in .*exception' -Quiet)) { throw "the crash left no line in the log" }

      - uses: actions/upload-artifact@v4
        with:
          name: oh-snap-windows
          path: target/release/oh-snap.exe
          if-no-files-found: error

  release:
    # One release with every OS's file and one SHA256SUMS.txt that lists them all.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp artifacts/oh-snap-windows/oh-snap.exe dist/
          cp artifacts/oh-snap-macos/oh-snap-macos.zip dist/
          cp artifacts/oh-snap-macos/oh-snap-macos.dmg dist/
          cp artifacts/oh-snap-linux-x86_64/oh-snap-linux-x86_64.tar.gz dist/
          cp artifacts/oh-snap-linux-aarch64/oh-snap-linux-aarch64.tar.gz dist/
          (cd dist && sha256sum oh-snap.exe oh-snap-macos.zip oh-snap-macos.dmg oh-snap-linux-x86_64.tar.gz oh-snap-linux-aarch64.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" dist/* assets/oh-snap.png --title "oh-snap $GITHUB_REF_NAME" --generate-notes
