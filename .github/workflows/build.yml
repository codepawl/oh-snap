name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          ./target/release/oh-snap.exe --version
          ./target/release/oh-snap.exe preview preview-out
          if (-not (Test-Path preview-out/card-saved.png)) { throw "preview did not render" }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item target/release/oh-snap.exe oh-snap.exe
          $hash = (Get-FileHash oh-snap.exe -Algorithm SHA256).Hash
          "$hash  oh-snap.exe" | Set-Content SHA256SUMS.txt
          gh release create $env:GITHUB_REF_NAME oh-snap.exe SHA256SUMS.txt assets/oh-snap.png --title "oh-snap $env:GITHUB_REF_NAME" --generate-notes
